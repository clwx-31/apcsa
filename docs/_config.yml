# Site content settings -- owned by content work.
title: AP CSA Notebook
description: Daily notes from AP Computer Science A. Concepts, code, and the bugs along the way.
lang: en

# --- Presentation settings below: safe for Codex to change ---
theme: minima
show_excerpts: true

# Nav tabs in the site header, in order
header_pages:
  - number-riddle.md

# Jekyll should not try to build the Java coursework
exclude:
  - "*.java"
  - "*.class"
  - README.md          # internal: working agreement
  - POST-TEMPLATE.md   # internal: authoring spec
